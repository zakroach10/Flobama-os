<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FloBama Local Wall</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #100e0c;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: #100e0c;
      }
      #stage video,
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #100e0c;
      }
      .hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="/wall/player.js"></script>
  </body>
</html>
